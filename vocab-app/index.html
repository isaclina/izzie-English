<style>
/* Layout: a single-column workbook — home lists units, each word opens a five-step card, reviews are graded drills */
:root {
  --bg: #f3f5f9;
  --paper: #ffffff;
  --ink: #1a2238;
  --muted: #5c6782;
  --line: #d9dfeb;
  --accent: #2443b8;
  --accent-soft: #e4e9fb;
  --marker: #ffe36b;
  --good: #16794a;
  --good-soft: #dcf3e7;
  --bad: #b42a2a;
  --bad-soft: #fbe3e3;
  --display: "Bricolage Grotesque", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --paper: #182039; --ink: #e8ecf7; --muted: #9aa5c2; --line: #2b3657;
    --accent: #8ea6ff; --accent-soft: #24305a; --marker: #6b5a12;
    --good: #5fd39a; --good-soft: #143a2a; --bad: #ff8a8a; --bad-soft: #43191d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --paper: #182039; --ink: #e8ecf7; --muted: #9aa5c2; --line: #2b3657;
  --accent: #8ea6ff; --accent-soft: #24305a; --marker: #6b5a12;
  --good: #5fd39a; --good-soft: #143a2a; --bad: #ff8a8a; --bad-soft: #43191d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink); font-weight: 500; min-height: 44px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 700; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.9rem; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.units { display: grid; gap: 14px; }
.unit {
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; text-align: left; color: var(--ink);
}
.unit:hover { border-color: var(--accent); }
.unit .num { grid-row: span 3; font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; color: var(--accent); align-self: center; }
.unit .title { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.bar { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stats { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.panel { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; font-family: var(--display); font-weight: 500; font-size: 0.95rem;
}
.chip.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.chip:hover { border-color: var(--accent); }

.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.step {
  border: 0; border-bottom: 3px solid var(--line); background: none; color: var(--muted);
  padding: 6px 2px; font-size: 0.8rem; font-weight: 500; line-height: 1.3;
}
.step b { display: block; font-family: var(--mono); font-size: 0.75rem; }
.step.cur { color: var(--accent); border-color: var(--accent); font-weight: 700; }
.step.seen { color: var(--ink); }

.word { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.pos { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
.meaning { font-size: 1.3rem; font-weight: 700; }
.syn { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-family: var(--display); }
.syn .eq { font-size: 1.6rem; color: var(--muted); }
.syn .s2 { font-size: 2.2rem; font-weight: 700; color: var(--accent); }
.sentence { font-family: var(--display); font-size: 1.5rem; font-weight: 500; line-height: 1.45; }
mark { background: linear-gradient(transparent 55%, var(--marker) 55%); color: inherit; padding: 0 2px; font-weight: 700; }
.ko { color: var(--muted); }

textarea, input[type="text"] {
  width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical;
}
.feedback { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .answer { color: var(--ink); font-family: var(--display); font-size: 1.1rem; }
.w-ok { color: var(--good); }
.w-miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; font-weight: 700; }
.hint { font-family: var(--mono); letter-spacing: 0.05em; color: var(--muted); overflow-wrap: anywhere; }

.dots { display: flex; gap: 8px; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); }
.dot.fill { background: var(--accent); }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.counter { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.score { font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.wrong-list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.wrong-list li { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.wrong-list .yours { color: var(--bad); font-size: 0.9rem; }
.note { font-size: 0.85rem; color: var(--muted); }
.reviews { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.root { font-family: var(--mono); font-size: 0.95rem; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; align-self: flex-start; }
.review-card { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.review-card:hover { border-color: var(--accent); }
.review-card b { font-family: var(--display); font-size: 1.05rem; }
@media (max-width: 520px) { .reviews { grid-template-columns: 1fr; } .step { font-size: 0.7rem; } }
@media (prefers-reduced-motion: no-preference) { .panel { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(6px); } to { transform: none; } } }
</style>
</head>

let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Natural|Aria|Jenny/i.test(v.name))
       || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}

/* recorded mp3s in audio/ play first; the browser voice is the fallback */
const AUDIO = {};
UNITS.forEach(u => u.words.forEach(w => {
  const base = "audio/" + u.id + "-" + w.word;
  AUDIO[w.word] = AUDIO[w.word] || base + "-word.mp3";
  AUDIO[w.syn] = AUDIO[w.syn] || base + "-syn.mp3";
  AUDIO[w.sent] = base + "-sent.mp3";
}));
const player = new Audio();
let playToken = 0;
function stopSound() {
  playToken++;
  player.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function speak(text, slow) {
  stopSound();
  const parts = AUDIO[text] ? [text] : text.split(". ");
  if (!parts.every(p => AUDIO[p])) { ttsSpeak(text, slow); return; }
  const token = playToken;
  const playAt = k => {
    if (token !== playToken || k >= parts.length) return;
    player.src = AUDIO[parts[k]];
    player.playbackRate = slow ? 0.7 : 1;
    player.onended = () => setTimeout(() => playAt(k + 1), 300);
    player.onerror = () => { if (token === playToken) ttsSpeak(parts.slice(k).join(". "), slow); };
    player.play().catch(err => { if (err.name !== "AbortError" && token === playToken) ttsSpeak(parts.slice(k).join(". "), slow); });
  };
  playAt(0);
}
function ttsSpeak(text, slow) {
  if (!("speechSynthesis" in window)) { toastNoTTS(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice;
  u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
function toastNoTTS() {

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => s.toLowerCase().replace(/(\d),(?=\d)/g, "$1").replace(/[’‘`]/g, "'").replace(/[^a-z0-9'\s-]/g, " ").replace(/-/g, " ").replace(/\s+/g, " ").trim();
const unitById = id => UNITS.find(u => u.id === id);
const key = (u, w) => u.id + ":" + w.word;
const studiedCount = u => u.words.filter(w => progress.studied[key(u, w)]).length;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function highlight(w) {
  const safe = esc(w.sent);
  const re = new RegExp("\\b(" + w.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)", "i");
  return safe.replace(re, "<mark>$1</mark>");
}
function hintOf(sent) { return sent.split(" ").map(t => t.replace(/[A-Za-z]/g, (c, i) => i === 0 ? c : "_")).join("  "); }

/* word-level comparison: mark which words of the answer the student got (LCS) */
function compare(expected, typed) {
  const a = norm(expected).split(" "), b = norm(typed).split(" ").filter(Boolean);
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const orig = expected.split(" ");
  const html = orig.map((t, k) => `<span class="${hit.has(k) ? "w-ok" : "w-miss"}">${esc(t)}</span>`).join(" ");
  const exact = norm(expected) === norm(typed);
  return { exact, html, ratio: hit.size / a.length };
}

    <button class="btn" data-act="say" data-slow="1" data-text="${esc(w.sent)}">🐢 천천히</button>
    <button class="btn ${state.showKo ? "on" : ""}" data-act="toggleKo">한국어 뜻</button></div>`;
  if (s === 4) body = `
    <p class="eyebrow">Dictation · 듣고 쓰기</p>
    <p class="ko">${esc(w.sentKo)}</p>
    <div class="row"><button class="btn primary" data-act="say" data-text="${esc(w.sent)}">🔊 문장 듣기</button>
    <button class="btn" data-act="say" data-slow="1" data-text="${esc(w.sent)}">🐢 천천히</button>
    <button class="btn ${state.showHint ? "on" : ""}" data-act="toggleHint">힌트</button></div>
    <p class="hint" ${state.showHint ? "" : "hidden"}>${esc(hintOf(w.sent))}</p>
    <label for="write-input" class="muted">들은 문장을 영어로 써 보세요.</label>
    <textarea id="write-input" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" data-autofocus>${esc(state.draft || "")}</textarea>
    <div class="row"><button class="btn primary" data-act="checkWrite">확인</button></div>
    <div id="write-result" aria-live="polite">${state.writeResult || ""}</div>`;
  const last = state.i === u.words.length - 1;
  return `
  <div class="top"><button class="back" data-act="unit" data-unit="${u.id}">← ${u.label} 단어 목록</button>
  <span class="counter">${state.i + 1} / ${u.words.length}</span></div>
  <section class="panel">
    <nav class="steps" aria-label="학습 단계">${tabs}</nav>
    ${body}
    <p id="tts-note" class="note" hidden>이 브라우저에서는 소리 재생을 지원하지 않아요. 크롬이나 사파리에서 열어 주세요.</p>
  </section>
  <div class="nav">
    <button class="btn" data-act="prev" ${state.i === 0 && s === 0 ? "disabled" : ""}>← 이전</button>
    <button class="btn primary" data-act="next">${s < 4 ? "다음 단계 →" : last ? "유닛 완료 ✓" : "다음 단어 →"}</button>
  </div>`;
}

function viewReviewSetup() {
  const u = unitById(state.unit), idx = UNITS.indexOf(u);
  const t = state.rtype || "word", c = Math.min(state.rcount || 10, u.words.length);
  return `
  <div class="top"><button class="back" data-act="home">← 처음으로</button></div>
  <header><p class="eyebrow">${u.label} Review · ${esc(u.en)}</p><h1>${esc(u.title)} 리뷰</h1></header>
  <section class="panel">
    <h2>무엇을 연습할까요?</h2>
    <div class="row">
      <button class="btn ${t === "word" ? "on" : ""}" data-act="rtype" data-v="word">단어 쓰기</button>
      <button class="btn ${t === "sentence" ? "on" : ""}" data-act="rtype" data-v="sentence">문장 쓰기</button>
    </div>
    <p class="muted">${t === "word" ? "한국어 뜻을 보고 발음을 들은 뒤 영어 단어의 철자를 씁니다." : "한국어 해석을 보고 문장을 들은 뒤 영어 문장 전체를 씁니다."}</p>
    <h2>문항 수</h2>
    <div class="row">${[10, 20, 30].filter(n => n < u.words.length).concat(u.words.length).map(n => `<button class="btn ${c === n ? "on" : ""}" data-act="rcount" data-v="${n}">${n}문항</button>`).join("")}</div>
    <p class="stats">최고 기록 · 단어 쓰기 ${bestText(u, "word")} · 문장 쓰기 ${bestText(u, "sentence")}</p>
    <div class="row"><button class="btn primary" data-act="startReview">시작하기</button></div>
  </section>`;
}

function startReview(items) {
  const u = unitById(state.unit);
  const t = state.rtype || "word", c = Math.min(state.rcount || 10, u.words.length);
  state.queue = items || shuffle(u.words).slice(0, c);
  state.q = 0; state.answers = []; state.checked = null; state.view = "review";
  render();
  autoSpeak();
}
function autoSpeak() {
  const w = state.queue[state.q];
  setTimeout(() => speak(state.rtype === "sentence" ? w.sent : w.word), 250);
}

function viewReview() {
  const u = unitById(state.unit), w = state.queue[state.q], t = state.rtype || "word";
  const ck = state.checked;
  const prompt = t === "word"
    ? `<p class="pos">${esc(w.pos)}</p><p class="meaning" style="font-size:1.8rem">${esc(w.ko)}</p>`
    : `<p class="meaning">${esc(w.sentKo)}</p>`;
  let fb = "";
  if (ck) {
    fb = ck.ok
      ? `<div class="feedback good"><b>정답이에요!</b><span class="answer">${esc(t === "word" ? w.word : w.sent)}</span></div>`
      : `<div class="feedback bad"><b>다시 확인해 보세요.</b><span class="answer">${t === "word" ? esc(w.word) : ck.html}</span>
         ${t === "sentence" ? `<span class="note">밑줄 친 단어를 놓쳤거나 틀렸어요.</span>` : ""}</div>`;
  }
  const tag = t === "word"
    ? `<input type="text" id="review-input" autocomplete="off" autocapitalize="off" spellcheck="false" ${ck ? "disabled" : ""} value="${esc(ck ? ck.typed : "")}" data-autofocus>`
    : `<textarea id="review-input" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" ${ck ? "disabled" : ""} data-autofocus>${esc(ck ? ck.typed : "")}</textarea>`;
  return `
  <div class="top"><button class="back" data-act="reviewSetup" data-unit="${u.id}">← 그만하기</button>
  <span class="counter">${state.q + 1} / ${state.queue.length} · 정답 ${state.answers.filter(a => a.ok).length}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${state.q / state.queue.length * 100}%"></i></div>
  <section class="panel">
    <p class="eyebrow">${t === "word" ? "단어 쓰기" : "문장 쓰기"}</p>
    ${prompt}
    <div class="row"><button class="btn" data-act="say" data-text="${esc(t === "word" ? w.word : w.sent)}">🔊 다시 듣기</button>
    <button class="btn" data-act="say" data-slow="1" data-text="${esc(t === "word" ? w.word : w.sent)}">🐢 천천히</button></div>
    <label for="review-input" class="muted">${t === "word" ? "영어 단어를 쓰세요." : "들은 영어 문장을 쓰세요."}</label>
    ${tag}
    ${fb}
    <div class="row">${ck
      ? `<button class="btn primary" data-act="nextQ" data-autofocus>${state.q === state.queue.length - 1 ? "결과 보기" : "다음 문제 →"}</button>`
      : `<button class="btn primary" data-act="checkQ">확인</button><button class="btn" data-act="skipQ">모르겠어요</button>`}</div>
    <p id="tts-note" class="note" hidden>이 브라우저에서는 소리 재생을 지원하지 않아요.</p>
  </section>`;
}

function viewResult() {
  const u = unitById(state.unit), t = state.rtype || "word";
  const score = state.answers.filter(a => a.ok).length, total = state.answers.length;
  const wrong = state.answers.filter(a => !a.ok);
  return `
  <div class="top"><button class="back" data-act="home">← 처음으로</button></div>
  <section class="panel">
    <p class="eyebrow">${esc(u.title)} · ${t === "word" ? "단어 쓰기" : "문장 쓰기"} 결과</p>
    <p class="score">${score} / ${total}</p>
    <p class="muted">${score === total ? "모두 맞혔어요. 훌륭해요!" : `틀린 ${wrong.length}문항을 다시 연습해 보세요.`}</p>
    <div class="row">
      ${wrong.length ? `<button class="btn primary" data-act="retryWrong">틀린 문제만 다시</button>` : ""}
      <button class="btn" data-act="startReview">새로 섞어서 다시</button>
      <button class="btn" data-act="unit" data-unit="${u.id}">단어 다시 학습</button>
    </div>
    ${wrong.length ? `<ul class="wrong-list">${wrong.map(a => `<li>
      <span><b>${esc(a.w.word)}</b> <span class="muted">${esc(a.w.ko)}</span></span>
      ${t === "sentence" ? `<span>${esc(a.w.sent)}</span>` : ""}
      <span class="yours">내 답: ${a.typed ? esc(a.typed) : "(빈칸)"}</span></li>`).join("")}</ul>` : ""}
  </section>`;
}

/* ---------- actions ---------- */
function gotoStudy(i) { Object.assign(state, { view: "study", i, step: 0, reps: 0, showKo: false, showHint: false, draft: "", writeResult: "" }); render(); }
function setStep(s) { Object.assign(state, { step: s, reps: 0, showKo: false, showHint: false, draft: "", writeResult: "" }); render(); }

function checkWrite() {
  const u = unitById(state.unit), w = u.words[state.i];
  const typed = document.getElementById("write-input").value;
  state.draft = typed;
  if (!typed.trim()) return;
  const r = compare(w.sent, typed);
  if (r.exact) {
    progress.studied[key(u, w)] = true; save();
    state.writeResult = `<div class="feedback good"><b>완벽해요! 이 단어 학습을 마쳤어요.</b><span class="answer">${esc(w.sent)}</span></div>`;
  } else {
    state.writeResult = `<div class="feedback bad"><b>거의 다 왔어요. 다시 들어 보고 고쳐 써 보세요.</b><span class="answer">${r.html}</span><span class="note">밑줄 친 단어를 확인하세요.</span></div>`;
  }
  render();
}

function checkQ(skip) {
  const w = state.queue[state.q], t = state.rtype || "word";
  const typed = skip ? "" : document.getElementById("review-input").value;
  if (!skip && !typed.trim()) return;
  let ok, html = "";
  if (t === "word") ok = norm(typed) === norm(w.word);
  else { const r = compare(w.sent, typed); ok = r.exact; html = r.html; }
  state.checked = { ok, typed, html };
  state.answers.push({ w, ok, typed });
  render();
  if (!ok) speak(t === "word" ? w.word : w.sent);
}
function nextQ() {
  if (state.q < state.queue.length - 1) { state.q++; state.checked = null; render(); autoSpeak(); return; }
  const u = unitById(state.unit), t = state.rtype || "word";
  const score = state.answers.filter(a => a.ok).length, total = state.answers.length;
  const k = u.id + ":" + t, b = progress.best[k];
  if (!b || score / total > b.score / b.total || (score / total === b.score / b.total && total > b.total)) { progress.best[k] = { score, total }; save(); }
  state.view = "result"; render();
}

function listen() {
  const u = unitById(state.unit), w = u.words[state.i];
  const out = document.getElementById("mic-result");
  let rec;
  try { rec = new Recognition(); } catch (e) { out.innerHTML = `<p class="note">음성 인식을 시작할 수 없어요. "따라 말했어요" 버튼을 사용하세요.</p>`; return; }
  rec.lang = "en-US"; rec.maxAlternatives = 5; rec.interimResults = false;
  out.innerHTML = `<p class="muted">🎤 듣고 있어요… "${esc(w.word)}" 라고 말해 보세요.</p>`;
  rec.onresult = e => {
    const alts = Array.from(e.results[0]).map(a => a.transcript);
    const ok = alts.some(a => norm(a).split(" ").includes(norm(w.word)));
    if (ok) state.reps = Math.min(3, state.reps + 1);
    const html = ok
      ? `<div class="feedback good"><b>좋아요! 정확하게 들렸어요.</b></div>`
      : `<div class="feedback bad"><b>이렇게 들렸어요: "${esc(alts[0] || "")}"</b><span class="note">발음을 다시 듣고 한 번 더 말해 보세요.</span></div>`;
    render();
    document.getElementById("mic-result").innerHTML = html;
  };
  rec.onerror = e => {
    out.innerHTML = e.error === "not-allowed" || e.error === "service-not-allowed"
      ? `<p class="note">마이크를 사용할 수 없어요. 브라우저에서 마이크를 허용하거나 "따라 말했어요" 버튼을 사용하세요.</p>`
      : e.error === "no-speech" ? `<p class="note">소리가 들리지 않았어요. 다시 눌러 말해 보세요.</p>`
      : `<p class="note">음성 인식 중 문제가 생겼어요 (${esc(e.error)}). "따라 말했어요" 버튼을 사용하세요.</p>`;
  };
  try { rec.start(); } catch (e) {}
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "home") { state = { view: "home" }; render(); }
  else if (act === "unit") { state = { view: "unit", unit: b.dataset.unit }; render(); }
  else if (act === "study") gotoStudy(+b.dataset.i);
  else if (act === "step") setStep(+b.dataset.s);
  else if (act === "say") speak(b.dataset.text, b.dataset.slow === "1");
  else if (act === "repeat") { state.reps = Math.min(3, state.reps + 1); render(); speak(unitById(state.unit).words[state.i].word); }
  else if (act === "listen") listen();
  else if (act === "toggleKo") { state.showKo = !state.showKo; render(); }
  else if (act === "toggleHint") { state.draft = document.getElementById("write-input").value; state.showHint = !state.showHint; render(); }
  else if (act === "checkWrite") checkWrite();
  else if (act === "next") {
    const u = unitById(state.unit);
    if (state.step < 4) setStep(state.step + 1);
    else if (state.i < u.words.length - 1) gotoStudy(state.i + 1);
    else { state = { view: "unit", unit: u.id }; render(); }
  }
  else if (act === "prev") {
    if (state.step > 0) setStep(state.step - 1);
    else if (state.i > 0) { gotoStudy(state.i - 1); setStep(4); }
  }
  else if (act === "reviewSetup") { state = { view: "reviewSetup", unit: b.dataset.unit, rtype: state.rtype, rcount: state.rcount }; render(); }
  else if (act === "rtype") { state.rtype = b.dataset.v; render(); }
  else if (act === "rcount") { state.rcount = +b.dataset.v; render(); }
  else if (act === "startReview") startReview();
  else if (act === "checkQ") checkQ(false);
  else if (act === "skipQ") checkQ(true);
  else if (act === "nextQ") nextQ();
  else if (act === "retryWrong") startReview(shuffle(state.answers.filter(a => !a.ok).map(a => a.w)));
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
  if (e.target.id === "write-input") { e.preventDefault(); checkWrite(); }
  else if (e.target.id === "review-input") { e.preventDefault(); checkQ(false); }
});

render();
</script>
</body>
</html>
